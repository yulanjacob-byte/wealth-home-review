.page-switch button {border:0;border-radius:5px;background:transparent;color:#59677c;padding:5px 12px;cursor:pointer;}
.page-switch button.is-active {background:white;color:#184c9c;box-shadow:0 1px 4px #14294415;font-weight:600;}
.ranking-picker {display:flex;align-items:center;gap:8px;flex-basis:100%;}

.state-details {margin-left:auto;max-width:100%;font-size:12px;color:var(--muted);}
.state-details summary {cursor:pointer;padding:5px 0;}.state-details[open] {flex-basis:100%;margin-left:0;}
.state-buttons {display:flex;gap:6px;flex-wrap:wrap;padding-top:4px;}
.state-buttons button {border:1px solid var(--line);border-radius:5px;background:white;color:#59677c;padding:4px 8px;cursor:pointer;font-size:12px;}
.state-buttons button.is-active {color:#184c9c;border-color:#b3c7e8;background:#edf4ff;}
.state-buttons button:disabled {display:none;}
.state-controls select {width:100%;min-width:0;max-width:100%;padding:7px 8px;border:1px solid #cbd3e0;border-radius:6px;background:white;color:var(--ink);}
.prototype-stage {min-height:0;flex:1;overflow:hidden;background:#edf0f5;}
#prototypeFrame {display:block;width:100%;height:100%;border:0;}
.requirements-nav {display:flex;flex-wrap:wrap;gap:5px;padding:10px 16px;background:white;border-bottom:1px solid var(--line);max-height:112px;overflow-y:auto;scrollbar-width: none;}
.requirements-nav::-webkit-scrollbar {display:none;}
.requirements-nav button {border:0;border-radius:4px;background:#f0f3f8;color:#53627a;padding:4px 8px;cursor:pointer;font-size:12px;}
.requirements-nav button.is-active {color:white;background:var(--accent);}
.requirements-body {flex:1;min-height:0;overflow-y:auto;padding:18px 24px 48px;background:white;scroll-behavior:smooth;scrollbar-width:thin;}
.requirements-body h1 {font-size:23px;margin:0 0 16px;}.requirements-body h2 {font-size:19px;margin:26px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px;}
.requirements-body h3 {font-size:16px;margin:22px 0 10px;}.requirements-body h4 {font-size:15px;margin:18px 0 8px;}
.requirements-body h1,.requirements-body h2,.requirements-body h3,.requirements-body h4 {scroll-margin-top:12px;line-height:1.8;overflow-wrap:anywhere;}
.requirements-body p {margin:10px 0;overflow-wrap:anywhere;}
.table-wrap {width:100%;overflow-x:auto;margin:12px 0 18px;}
table {width:100%;border-collapse:collapse;font-size:13px;line-height:1.75;}
th,td {vertical-align:top;text-align:left;border:1px solid var(--line);padding:9px 10px;min-width:60px;overflow-wrap:anywhere;}
th {background:#f3f5f9;font-weight:600;}
.review-link {display:inline-block;border:1px solid #c4d6f8;border-radius:14px;background:#edf4ff;color:#2155a8;padding:1px 8px;margin:0 6px 3px 0;font-size:11px;line-height:1.8;cursor:pointer;}
.review-link[hidden] {display:none;}.review-linked.is-highlighted {background:#eaf2ff;box-shadow:-4px 0 var(--accent);}
.review-note {font-size:12px;color:var(--muted);margin:6px 0 0;}
@media(max-width:750px) {.review-workspace{grid-template-columns:minmax(240px,45%) minmax(0,1fr)}.requirements-body{padding:14px}.column-head{padding:8px}.requirements-nav{padding:8px}}

e榜单功能无需登录，未登录用户也可以使用。\u003c/strong\u003e 用户从理财首页点击“榜单选基”，即可浏览榜单、选择要展示的榜单、查看规则、打开完整榜单、切换排序、返回。以上操作均不弹出登录提示。\u003c/p\u003e\n\u003cp\u003e基金列表只展示基金名称和指标，本期不提供点击基金行进入详情、加入自选或购买的功能。\u003c/p\u003e\n\u003cp\u003e精选推荐中的榜单卡使用相同的榜单数据。哪些用户能在精选推荐中看到榜单卡、卡片的展示位置和推荐方式，按精选推荐模块的需求执行。\u003c/p\u003e\n\u003ch2 id=\"m06-flow\" data-annotation-id=\"ANN-wealth-home-m06-ranking-001 ANN-wealth-home-m06-ranking-qdiiQuota-001 ANN-wealth-home-m06-ranking-institutionalFavor-001 ANN-wealth-home-m06-ranking-indexEnhance-001 ANN-wealth-home-m06-ranking-monthlyPositive-001 ANN-wealth-home-m06-ranking-longRun-001 ANN-wealth-home-m06-ranking-quantPerformance-001 ANN-wealth-home-m06-ranking-highDividendIndex-001 ANN-wealth-home-m06-ranking-themePioneer-001 ANN-wealth-home-m06-ranking-broadMarketA-001 ANN-wealth-home-m06-ranking-techTheme-001 ANN-wealth-home-m06-ranking-consumerTheme-001 ANN-wealth-home-m06-ranking-newEnergyTheme-001 ANN-wealth-home-m06-ranking-advancedManufacturingTheme-001 ANN-wealth-home-m06-ranking-medicineTheme-001 ANN-wealth-home-m06-ranking-energyMaterialsTheme-001 ANN-wealth-home-m06-ranking-utilitiesTheme-001 ANN-wealth-home-m06-ranking-financePropertyTheme-001\" class=\"review-linked\"\u003e\u003cbutton type=\"button\" class=\"review-link\" data-annotation-id=\"ANN-wealth-home-m06-ranking-001\"\u003e页面对应 01\u003c/button\u003e\u003cbutton type=\"button\" class=\"review-link\" data-annotation-id=\"ANN-wealth-home-m06-ranking-qdiiQuota-001\"\u003e页面对应 01\u003c/button\u003e\u003cbutton type=\"button\" class=\"review-link\" data-annotation-id=\"ANN-wealth-home-m06-ranking-institutionalFavor-001\"\u003e页面对应 01\u003c/button\u003e\u003cbutton type=\"button\" class=\"review-link\" data-annotation-id=\"ANN-wealth-home-m06-ranking-indexEnhance-001\"\u003e页面对应 01\u003c/button\u003e\u003cbutton type=\"button\" class=\"review-link\" data-annotation-id=\"ANN-wealth-home-m06-ranking-monthlyPositive-001\"\u003e页面对应 01\u003c/button\u003e\u003cbutton type=\"button\" class=\"review-link\" data-a 003e\u003cth\u003e页面区域\u003c/th\u003e\u003cth\u003e显示内容与操作\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e首页榜单卡片\u003c/td\u003e\u003ctd\u003e展示当前已选榜单。每张卡片包含榜单名称、“榜单规则”、基金名称、两个指标和“查看完整榜单”入口\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e榜单规则\u003c/td\u003e\u003ctd\u003e点击后在当前卡片中展开规则，再次点击收起；与完整榜单页的规则一致\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e完整榜单页\u003c/td\u003e\u003ctd\u003e顶部居中显示榜单名称，右上角显示“规则”；列表上方显示数据日期和基金总数，手动排序后再显示当前排序说明。两个指标名称均可点击排序\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e返回\u003c/td\u003e\u003ctd\u003e返回首页进入详情前的位置，保留已展开的规则；完整榜单中的排序不改变首页顺序\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e操作流程：进入榜单选基 → 浏览榜单卡片 → 查看规则或打开完整榜单 → 点击指标排序 → 返回首页原位置。每次重新打开完整榜单，都恢复数仓提供的默认排名，并从列表顶部开始显示。\u003c/p\u003e\n\u003ch3 id=\"m06-detail-rules\"\u003e完整榜单的规则查看\u003c/h3\u003e\n\u003cp\u003e17个完整榜单页均不默认展开规则。用户点击右上角“规则”，从底部打开说明面板，显示当前榜单名称和完整入榜规则；内容较长时，可在面板内上下滚动查看。\u003c/p\u003e\n\u003cp\u003e点击“关闭”、面板外的灰色区域，或按Escape键，关闭说明面板。关闭后仍停留在原列表位置，保持当前排序和基金数据；再次打开时，从规则开头显示。面板打开期间，不能操作后方列表；键盘可以在关闭按钮和可滚动的规则内容间切换，关闭后回到“规则”入口。\u003c/p\u003e\n\u003cp\u003e正常、加载中、空榜、获取失败及保留旧数据时，“规则”入口都可使用。列表上方有数据日期时显示日期，有结果时显示实际基金数量，空榜显示0只；加载中或首次失败时不显示基金数量。默认排名下不显示排序说明，用户手动排序后再显示当前指标及排序方向。\u003c/p\u003e\n\u003ch3 id=\"m06-ranking-tabs\" data-annotation-id=\"ANN-wealth-home-m06-ranking-019\" class=\"review-linked\"\u003e\u003cbutton type=\"button\" class=\"review-link\" data-annotation-id=\"ANN-wealth-home-m06-ranking-019\"\u003e页面对应 02\u003c/button\u003e榜单导航与全部入口\u003c/h3\u003e\n\u003cp\u003e首页顶部横向显示已选榜单的名称，右侧固定显示“全部”按钮。首次使用时，默认展示以下5个榜单：QDII额度榜、机构青睐榜、指增超额榜、月月正收益榜、长跑业绩榜。\u003c/p\u003e\n\u003cp\u003e点击一个榜单名称，页面滚动到对应卡片，该名称显示为浅红底、红字；其他名称显示为浅灰底、灰字。上下浏览卡片时，顶部同步突出显示当前榜单。名称较多时，可以左右滑动、拖动或用鼠标滚轮浏览榜单名称，也可以用键盘选择榜单。\u003c/p\u003e\n\u003cp\u003e顶部名称与下方卡片一一对应，按下文列出的17榜顺序排列，不随勾选先后改变。\u003c/p\u003e\n\u003ch3 id=\"m06-selector\" data-annotation-id=\"ANN-wealth-home-m06-ranking-selector-001\" class=\"review-linked\"\u003e\u003cbutton type=\"button\" class=\"review-link\" data-annotation-id=\"ANN-wealth-home-m06-ranking-selector-001\"\u003e页面对应 01\u003c/button\u003e全部榜单选择\u003c/h3\u003e\n\u003cp\u003e点击“全部”后，从底部打开选择面板。17个榜单分为以下三组，可同时选择多个榜单，面板显示已选数量。\u003c/p\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e分组\u003c/th\u003e\u003cth\u003e榜单\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e特色榜单\u003c/td\u003e\u003ctd\u003eQDII额度榜、机构青睐榜、指增超额榜、月月正收益榜、长跑业绩榜、量化业绩榜\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e指数榜单\u003c/td\u003e\u003ctd\u003e高股息指数榜、A股宽基榜\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主题榜单\u003c/td\u003e\u003ctd\u003e主题先锋榜、科技主题榜、消费主题榜、新能源主题榜、高端制造主题榜、医药主题榜、能源材料主题榜、公用事业主题榜、金融地产主题榜\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e选择榜单只改变首页展示哪些卡片，不改变每个榜单里的基金、指标和排名。\u003c/p\u003e\n\u003ch3 id=\"m06-selector-confirm\" data-annotation-id=\"ANN-wealth-home-m06-ranking-selector-002\" class=\"review-linked\"\u003e\u003cbutton type=\"button\" class=\"review-link\" data-annotation-id=\"ANN-wealth-home-m06-ranking-selector-002\"\u003e页面对应 02\u003c/button\u003e选择确认与取消\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e至少选择1个榜单。全部取消选择时，“确定”按钮不可点击。\u003c/li\u003e\u003cli\u003e点击“确定”，关闭面板，同时更新顶部榜单名称和首页卡片。如果原先正在浏览的榜单仍在所选榜单中，继续显示该榜；否则滚动到所选榜单中排序最靠前的一个。\u003c/li\u003e\u003cli\u003e点击“关闭”、面板外的灰色区域，或按Escape键，取消本次修改，首页保持原来的选择。\u003c/li\u003e\u003cli\u003e再次打开面板时，自动勾选首页当前展示的榜单。\u003c/li\u003e\u003cli\u003e使用键盘时，只能选中面板内的选项和按钮，不能操作面板后方的页面。取消后，键盘选中位置回到“全部”按钮；确定后，回到当前榜单名称。\u003c/li\u003e\u003c/ul\u003e\n\u003ch2 id=\"m06-features\"\u003e榜单内容与排序\u003c/h2\u003e\n\u003ch3 id=\"m06-home-rules\"\u003e首页展示数量与各榜规则\u003c/h3\u003e\n\u003cp\u003e每个榜单按数仓提供的默认排名展示前5只基金。不足5只时显示实际数量，例如只有3只就展示3只；没有基金时保留榜单名称、规则和“查看完整榜单”入口，并显示“暂无符合条件的基金”。\u003c/p\u003e\n\u003cp\u003eApp不再次筛选基金、合并份额或重新调整默认排名。以下规则用于说明各榜如何选出基金，并核对数仓结果。A股宽基榜要求的是\u003cstrong\u003e指数成立超过5年\u003c/strong\u003e，不额外要求基金本身成立满5年。\u003c/p\u003e\n\u003ch4 id=\"m u003e“无限制”大于任意有限额度，从高到低时排在前，从低到高时排在后；页面始终显示“无限制”\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e排序范围\u003c/td\u003e\u003ctd\u003e对该榜全部基金排序，不能只排序屏幕上已经显示的基金\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e指标值相同\u003c/td\u003e\u003ctd\u003e用户手动排序时，指标值相同的基金保持数仓返回的原始先后顺序，不再比较其他指标；从高到低或从低到高排序时都按此规则处理\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e排序箭头、排序说明和基金排列必须一致。切换排序只改变当前完整榜单的排列，不增减基金，不改变首页排名。QDII额度榜默认排名中，近1年收益率相同时，申购限额较高的基金在前。\u003c/p\u003e\n\u003ch3 id=\"m06-values\"\u003e名称、指标与时间展示\u003c/h3\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e内容\u003c/th\u003e\u003cth\u003e展示要求\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e基金名称\u003c/td\u003e\u003ctd\u003e使用数仓提供的名称，不根据名称自行判断A/C份额或是否符合入榜条件；点击基金名称或所在行不跳转页面，也不触发其他操作\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e收益率、超额收益、年化收益、最大回撤、股息率、PE估值分位\u003c/td\u003e\u003ctd\u003e指标名称写明对应时间范围，统一保留2位小数并显示百分号，例如“26.83%”“12.60%”；最大回撤保留负号，例如“-5.00%”，排序时比较回撤幅度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFOF机构持有家数\u003c/td\u003e\u003ctd\u003e显示整数，数值后加“家”，例如“26家”\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e连续正收益月数\u003c/td\u003e\u003ctd\u003e显示整数，数值后加“个月”，例如“24个月”\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e当日申购限额\u003c/td\u003e\u003ctd\u003e不足1万元时用“元”，例如“5000元”；达到1万元时用“万元”，最多保留2位小数并省略末尾的0，例如“5万元”“1.25万元”；不限额时显示“无限制”\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e数据日期\u003c/td\u003e\u003ctd\u003e首页每张榜单卡片和对应完整榜单页显示“数据日期：YYYY-MM-DD”，使用数仓提供的本榜数据日期；未提供时不显示，不用当前日期代替。更新失败保留上次数据时，日期也保留为该批数据的日期。\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e显示数值时按上述位数四舍五入。排序始终使用数仓提供的原始数值，不使用页面四舍五入后的数字。例如，两只基金都显示“12.60%”，但原始数值不同，仍按原始数值排序；只有原始数值相同，才保持数仓返回的先后顺序。\u003c/p\u003e\n\u003ch2 id=\"m06-states\" data-annotation-id=\"ANN-wealth-home-m06-ranking-qdiiQuota-004 ANN-wealth-home-m06-ranking-institutionalFavor-004 ANN-wealth-home-m06-ranking-indexEnhance-004 A 3c/td\u003e\u003ctd\u003e不用其他榜单的基金填补\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e正在加载\u003c/td\u003e\u003ctd\u003e内容区显示“数据加载中”\u003c/td\u003e\u003ctd\u003e加载完成后显示基金列表或空榜提示\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e首次获取失败，尚无榜单数据\u003c/td\u003e\u003ctd\u003e显示“数据加载失败”\u003c/td\u003e\u003ctd\u003e保留榜单名称和规则，不显示重试按钮\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e已有数据，更新失败\u003c/td\u003e\u003ctd\u003e保留上次获取的榜单数据，并显示“更新失败，当前展示上次数据”\u003c/td\u003e\u003ctd\u003e首页继续展示上次数据的前5只；完整榜单页保留上次完整列表，仍可排序，不显示重试按钮\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e只有部分榜单失败\u003c/td\u003e\u003ctd\u003e只在失败榜单内显示提示；已有数据时保留上次数据，没有数据时显示“数据加载失败”\u003c/td\u003e\u003ctd\u003e其他成功榜单继续展示，不受失败榜单影响\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003ch2 id=\"m06-data\"\u003e数据来源与分工\u003c/h2\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e负责方\u003c/th\u003e\u003cth\u003e具体工作\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e数仓\u003c/td\u003e\u003ctd\u003e按各榜规则筛选基金、计算两个指标、确定各基金保留的份额、生成默认排名，并提供完整榜单结果\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eApp研发\u003c/td\u003e\u003ctd\u003e展示榜单和规则，实现榜单选择、完整列表、指标排序、返回、加载与失败提示\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eQDII申购状态和限额采用商城数据，限额每日更新。App使用数仓已加工的超额收益、PE估值分位和主题标签，不在页面中重新计算。\u003c/p\u003e\n\u003ch2 id=\"m06-quality\"\u003e页面展示与风险提示\u003c/h2\u003e\n\u003cp\u003e榜单用于帮助用户比较历史数据，不表示榜内基金适合每一位用户，也不代表未来收益。\u003c/p\u003e\n\u003cp\u003e榜单模块复用 App 现有统一风险提示，文案、样式和展示方式与 App 保持一致。\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e字体、间距和颜色与理财首页一致；内容和按钮不能被底部导航或系统手势区域遮挡。\u003c/li\u003e\u003cli\u003e正收益显示红色，负收益显示绿色。数字采用每位字符宽度一致的字体，便于比较。最大回撤、估值等指标使用普通文字颜色。\u003c/li\u003e\u003cli\u003e指标名称与下方数值对齐。基金名称过长时换行或省略，不遮挡指标、排序按钮和返回入口。\u003c/li\u003e\u003cli\u003e规则、排序和返回按钮支持键盘操作；使用键盘排序后，选中位置仍停留在刚操作的指标名称上。\u003c/li\u003e\u003c/ul\u003e\n\u003ch2 id=\"m06-acceptance\"\u003e验收要点\u003c/h2\u003e\n\u003col\u003e\u003cli\u003e未登录和已登录用户都能进入榜单并完成选榜、查看规则、打开完整榜单、排序、返回，不出现登录拦截。\u003c/li\u003e\u003cli\u003e17个榜单的名称、排列顺序、两个指标和筛选规则与本需求一致；首次默认展示前5榜，可通过“全部”修改。\u003c/li\u003e\u003cli\u003e每张卡片展示数仓默认排名中的前5只基金；只有3只时展示这3只；没有基金时显示空榜，不补其他基金。\u003c/li\u003e\u003cli\u003e每个“查看完整榜单”进入对应榜单；基金超过8只时也能查看全部结果。\u003c/li\u003e\u003cli\u003e点击任一指标都能排序，再次点击可以切换排序方向；最大回撤、PE估值分位和“无限制”限额按本需求处理，箭头和说明与结果一致。\u003c/li\u003e\u003cli\u003e手动排序时，同值基金在升序、降序和切换指标后，均保持数仓返回的原始先后顺序，不按其他指标重新排列。\u003c/li\u003e\u003cli\u003e首页卡片的规则可展开、收起；17个完整榜单页默认不展示规则正文，点击右上角“规则”打开本榜说明面板。关闭按钮、遮罩和Escape均可关闭，列表位置、数据及排序保持不变；各数据状态下均可查看规则。\u003c/li\u003e\u003cli\u003e完整榜单默认不显示排序说明，手动排序后显示当前指标和方向。完整榜单排序不影响首页；返回保留首页原位置和已展开规则，再次进入完整榜单恢复默认排名。\u003c/li\u003e\u003cli\u003e“全部”面板可多选；至少选择1个榜单；点击确定后更新首页，关闭、点击面板外的灰色区域或按Escape时取消修改。\u003c/li\u003e\u003cli\u003e加载、空榜、所有榜单加载失败和部分榜单加载失败显示正确；已有数据时更新失败，保留上次列表并显示“更新失败，当前展示上次数据”，完整榜单仍可排序；没有数据时显示“数据加载失败”。首页和完整榜单页均不显示重试按钮，失败榜单不影响其他成功榜单。\u003c/li\u003e\u003cli\u003e在窄屏和长名称、长指标名称情况下，文字、数值和按钮互不遮挡；滚动和键盘操作正常。\u003c/li\u003e\u003c/ol\u003e\n\u003col\u003e\u003cli\u003e百分比统一保留2位小数，家数和月数显示整数，申购限额按元/万元规则展示；显示相同但原始值不同的数值仍按原始值排序。\u003c/li\u003e\u003c/ol\u003e\n\u003col\u003e\u003cli\u003e同一榜单的首页卡片与完整榜单页显示相同的数据日期，格式为“数据日期：YYYY-MM-DD”；数仓未提供时不显示。更新失败时保留原数据日期，不改为当天日期。\u003c/li\u003e\u003c/ol\u003e\n\u003col\u003e\u003cli\u003e榜单模块使用 App 统一风险提示，核对文案、样式和展示方式与 App 现有提示一致。\u003c/li\u003e\u003c/ol\u003e","requirementsNav":"\u003cbutton type=\"button\" data-section-id=\"m06-overview\"\u003e功能说明\u003c/button\u003e\u003cbutton type=\"button\" data-section-id=\"m06-scope\"\u003e用户与入口\u003c/button\u003e\u003cbutton type=\"button\" data-section-id=\"m06-flow\"\u003e页面结构与操作流程\u003c/button\u003e\u003cbutton type=\"button\" data-section-id=\"m06-detail-rules\"\u003e完整榜单的规则查看\u003c/button\u003e\u003cbutton type=\"button\" data-section-id=\"m06-ranking-tabs\"\u003e榜单导航与全部入口\u003c/button\u003e\u003cbutton type=\"button\" data-section-id=\"m06-selector\"\u003e全部榜单选择\u003c/button\u003e\u003cbutton type=\"button\" data-section-id=\"m06-selector-confirm\"\u   const pages=new Map(data.states.filter(s=>s.scene==='normal'&&!s.surface&&s.pageKey!==homeKey&&s.pageKey!==selectorKey).map(s=>[s.pageKey,s]));
  let lastDetail=pages.keys().next().value;
  const modes=document.createElement('div');modes.className='page-switch';modes.setAttribute('aria-label','预览页面');
  const homeButton=document.createElement('button'),detailButton=document.createElement('button');
  homeButton.type=detailButton.type='button';homeButton.textContent='首页榜单';detailButton.textContent='完整榜单';modes.append(homeButton,detailButton);
  const rankRow=document.createElement('label');rankRow.className='ranking-picker';
  const rankLabel=document.createElement('span');rankLabel.textContent='选择榜单';
  const select=document.createElement('select');select.setAttribute('aria-label','选择完整榜单');
  pages.forEach((s,key)=>{const option=document.createElement('option');option.value=key;option.textContent=s.label.split(' · ')[0];select.append(option);});
  rankRow.append(rankLabel,select);
  const advanced=document.createElement('details');advanced.className='state-details';
  const stateSummary=document.createElement('summary');
  const stateButtons=document.createElement('div');stateButtons.className='state-buttons';
  advanced.append(stateSummary,stateButtons);
  const labels=Object.fromEntries(data.states.map(state=>[state.scene,state.sceneLabel]));
  const buttons=new Map();
  Object.entries(labels).forEach(([scene,label])=>{const button=document.createElement('button');button.type='button';button.textContent=label;button.dataset.scene=scene;
    button.addEventListener('click',()=>{const state=data.states.find(s=>s.pageKey===currentPage&&s.scene===scene&&(s.surface||'')===(activeState.surface||''));if(state){advanced.open=false;load(state);}});
    stateButtons.append(button);buttons.set(scene,button);
  });
  controls.append(modes,rankRow,advanced);
  document.querySelector('.column-head strong').textContent='榜单选基原型';
  document.querySelector('.column-head p').textContent='演示数据 · 蓝色编号对应右侧需求。';
  function updateControls(){
    const home=currentPage===homeKey||currentPage===selectorKey;
    homeButton.classList.toggle('is-active',home);detailButton.classList.toggle('is-active',!home);
    homeButton.setAttribute('aria-pressed',String(home));detailButton.setAttribute('aria-pressed',String(!home));
    advanced.hidden=currentPage===selectorKey;rankRow.hidden=home;if(!home)lastDetail=currentPage;select.value=lastDetail;
    stateSummary.textContent='数据状态：'+labels[activeState.scene];
    buttons.forEach((button,scene)=>{button.disabled=!data.states.some(s=>s.pageKey===currentPage&&s.scene===scene&&(s.surface||'')===(activeState.surface||''));button.classList.toggle('is-active',scene===activeState.scene);});
  }
  homeButton.addEventListener('click',()=>load(data.states.find(s=>s.pageKey===homeKey&&s.scene==='normal')));
  detailButton.addEventListener('click',()=>load(pages.get(lastDetail)));

  function updateLinks() {
    body.querySelectorAll('button.review-link').forEach(button=>{
      const id=button.dataset.annotationId, item=data.annotationIndex[id];
      button.hidden=!ready || item.pageKey!==currentPage || !available.has(id);
      button.title=item.title;
    });
  }
  function load(state,focus) {
    activeState=state;currentPage=state.pageKey;pending=focus||null;ready=false;available.clear();
    updateControls();updateLinks();
    const url=new URL(location.href);url.searchParams.set('m06Entry',state.id);history.replaceState(null,'',url);
    if(parent!==window)parent.postMessage({type:'m06-review:entry-changed',entryId:state.id},'*');
    frame.src=state.prototype;
  }
  function highlight(id) {
    const mapping=data.annotationIndex[id];if(!mapping)return;
    body.querySelectorAll('.is-highlighted').forEach(el=>el.classList.remove('is-highlighted'));
    const target=document.getElementById(mapping.reviewSectionId);
    if(target){target.classList.add('is-highlighted');body.scrollTo({top:target.getBoundingClientRect().top-body.getBoundingClientRect().top+body.scrollTop-12,behavior:'smooth'});}
  }
  function send(id) {
    const item=data.annotationIndex[id];if(!item || item.pageKey!==currentPage || !available.has(id))return;
    frame.contentWindow.postMessage({type:'review-center:focus-annotation',annotationId:id,pageKey:currentPage},'*');
  }
  body.addEventListener('click',e=>{const b=e.target.closest('button.review-link');if(!b || b.hidden)return;highlight(b.dataset.annotationId);send(b.dataset.annotationId);});
  select.addEventListener('change',()=>{const state=pages.get(select.value);if(state)load(state);});
  nav.addEventListener('click',e=>{const b=e.target.closest('[data-section-id]');if(!b)return;const target=document.getElementById(b.dataset.sectionId);if(target)body.scrollTo({top:target.getBoundingClientRect().top-body.getBoundingClientRect().top+body.scrollTop-12,behavior:'smooth'});});
  body.addEventListener('scroll',()=>{
    const threshold=body.getBoundingClientRect().top+40;
    const headings=[...body.querySelectorAll('h2,h3')];let active=headings[0];
    for(const h of headings)if(h.getBoundingClientRect().top<=threshold)active=h;
    nav.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.sectionId===active?.id));
  },{passive:true});
  window.addEventListener('message',e=>{
    if(e.source!==frame.contentWindow || !e.data)return;
    const msg=e.data;
    if(msg.type==='review-center:module-request'&&['M03','M04'].includes(msg.module)) {if(parent!==window)parent.postMessage({type:'m06-review:module-request',module:msg.module},'*');return;}
    if(!data.states.some(s=>s.pageKey===msg.pageKey))return;
    if(msg.type==='review-center:page-ready') {
      if(!Array.isArray(msg.annotationIds))return;
      currentPage=msg.pageKey;
      available=new Set(msg.annotationIds.filter(id=>data.annotationIndex[id]?.pageKey===currentPage));
      ready=true;updateLinks();
      // Follow in-prototype navigation without reloading it or losing return scroll.
      const matching=data.states.find(s=>s.pageKey===currentPage && s.scene===activeState.scene && (s.surface||'')===(msg.surface||''));
      if(matching) activeState=matching;
      updateControls();
      if(matching){
        const url=new URL(location.href);url.searchParams.set('m06Entry',matching.id);history.replaceState(null,'',url);
        if(parent!==window)parent.postMessage({type:'m06-review:entry-changed',entryId:matching.id},'*');
      }
      if(pending){const id=pending;pending=null;send(id);}return;
    }
    if(msg.type!=='review-center:annotation-selected' || msg.pageKey!==currentPage || !available.has(msg.annotationId))return;
    if(data.annotationIndex[msg.annotationId]?.pageKey!==currentPage)return;
    highlight(msg.annotationId);
  });
  frame.addEventListener('load',()=>frame.contentWindow.postMessage({type:'review-center:request-ready'},'*'));
  const requested=new URLSearchParams(location.search).get('m06Entry');
  load(data.states.find(s=>s.id===requested)||data.states[0]);
})();
</script>
</body>
</html>
